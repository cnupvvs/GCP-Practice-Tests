<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ACE Certification Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E131A;
  --surface:#171D27;
  --surface-2:#1F2733;
  --surface-3:#262F3D;
  --border:#2B3444;
  --border-soft:#232B38;
  --text:#EDF1F6;
  --text-muted:#93A0B4;
  --text-faint:#5E6B80;
  --accent:#33D6AC;
  --accent-dim:#1E7A62;
  --accent-ink:#04140F;
  --warn:#F0A93E;
  --danger:#EF5B5B;
  --danger-dim:#3A1E20;
  --radius:14px;
  --radius-sm:8px;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(51,214,172,0.08), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(240,169,62,0.05), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;padding:28px 20px 60px;min-height:100vh;display:flex;flex-direction:column;}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--accent-ink);flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:0.01em;}
.brand-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:1px;}
.top-actions a, .top-actions button.linklike{
  font-family:var(--font-mono);font-size:12px;color:var(--text-muted);background:none;border:none;cursor:pointer;
  text-decoration:none;padding:6px 0;
}
.top-actions button.linklike:hover{color:var(--accent);}

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:32px;
}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;}
.center-screen{flex:1;display:flex;align-items:center;justify-content:center;}
.center-screen .card{max-width:480px;width:100%;}

h1.hero{font-family:var(--font-display);font-size:clamp(28px,4vw,38px);font-weight:700;line-height:1.15;margin:0 0 6px;}
p.lede{color:var(--text-muted);font-size:15px;margin:0 0 8px;max-width:56ch;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}

.stub{
  display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface-2);
}
.stub-main{flex:1;padding:22px 24px;}
.stub-tab{
  width:150px;padding:22px 18px;background:var(--surface-3);border-left:1px dashed var(--border);
  display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;
}
.stub-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
.stub-value{font-family:var(--font-mono);font-size:15px;color:var(--text);font-weight:500;}

.field{display:flex;flex-direction:column;gap:7px;}
.field label{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;}
.field input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  font-family:var(--font-mono);font-size:16px;padding:13px 14px;border-radius:var(--radius-sm);
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--text-faint);}
.hint{font-size:12.5px;color:var(--text-faint);}
.error-text{font-size:12.5px;color:var(--danger);min-height:16px;}

.btn{
  font-family:var(--font-body);font-weight:600;font-size:14.5px;
  padding:13px 20px;border-radius:var(--radius-sm);border:1px solid transparent;
  cursor:pointer;transition:transform .08s ease, opacity .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{opacity:0.92;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{border-color:var(--text-muted);}
.btn-danger{background:var(--danger);color:#2A0A0A;}
.btn-block{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.choice-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;}
.tile{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 18px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
  font-family:var(--font-body);color:var(--text);
}
.tile:hover{border-color:var(--accent);background:var(--surface-3);}
.tile .tile-icon{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.tile .tile-title{font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:4px;}
.tile .tile-desc{font-size:13px;color:var(--text-muted);}

.badge{
  font-family:var(--font-mono);font-size:11px;padding:3px 9px;border-radius:100px;
  border:1px solid var(--border);color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;
}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
.badge.ok{color:var(--accent);border-color:var(--accent-dim);}
.badge.ok .badge-dot{background:var(--accent);}
.badge.warn{color:var(--warn);border-color:#5A4420;}
.badge.warn .badge-dot{background:var(--warn);}

.module-list{display:flex;flex-direction:column;gap:10px;margin:6px 0;}
.module-row{
  display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
}
.module-row .mname{font-size:13.5px;color:var(--text);}
.module-row .mcount{font-family:var(--font-mono);font-size:12px;color:var(--accent);}

/* Exam screen */
.exam-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 18px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);
  margin-bottom:16px;position:sticky;top:12px;z-index:5;
}
.exam-id{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);}
.exam-id b{color:var(--text);}
.timer{
  font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--text);
  padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:var(--surface-2);
  letter-spacing:0.03em;
}
.timer.warn{color:var(--warn);border-color:#5A4420;}
.timer.danger{color:var(--danger);border-color:#5A2323;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.55;}}

.progress-strip{display:flex;gap:3px;margin:2px 0 18px;}
.progress-seg{flex:1;display:flex;gap:2px;}
.progress-dot{flex:1;height:5px;border-radius:2px;background:var(--border);}
.progress-dot.answered{background:var(--accent);}
.progress-dot.current{background:var(--warn);}

.module-tag{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;}
.qcounter{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-bottom:6px;}
.qtext{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.4;margin:0 0 22px;}

.option{
  display:flex;align-items:flex-start;gap:12px;padding:15px 16px;margin-bottom:10px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  cursor:pointer;transition:border-color .12s,background .12s;
}
.option:hover{border-color:var(--text-muted);}
.option.selected{border-color:var(--accent);background:rgba(51,214,172,0.08);}
.option .opt-letter{
  font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-muted);
  width:24px;height:24px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.option.selected .opt-letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.option .opt-text{font-size:14.5px;padding-top:2px;}

.exam-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;}
.jumpgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin-top:20px;}
.jumpgrid-wrap{margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft);}
.jumpgrid-label{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.jbtn{
  aspect-ratio:1;border-radius:5px;border:1px solid var(--border);background:var(--surface-2);
  font-family:var(--font-mono);font-size:10px;color:var(--text-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.jbtn.answered{background:rgba(51,214,172,0.16);border-color:var(--accent-dim);color:var(--accent);}
.jbtn.current{border-color:var(--warn);color:var(--warn);}

/* Result screen */
.score-hero{text-align:center;padding:36px 20px;}
.score-num{font-family:var(--font-display);font-size:64px;font-weight:700;line-height:1;}
.score-den{font-family:var(--font-mono);font-size:16px;color:var(--text-muted);margin-top:6px;}
.score-pct{font-family:var(--font-mono);font-size:13px;margin-top:12px;}
.pass{color:var(--accent);}
.fail{color:var(--danger);}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
.stat-box{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:14px 16px;}
.stat-box .stat-label{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;}
.stat-box .stat-value{font-family:var(--font-display);font-size:20px;font-weight:600;margin-top:4px;}

/* Admin table */
table.admin-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
table.admin-table th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:0.06em;padding:9px 10px;border-bottom:1px solid var(--border);
}
table.admin-table td{padding:11px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);}
table.admin-table tr:hover td{background:var(--surface-2);}
.mono{font-family:var(--font-mono);}

footer.foot{margin-top:auto;padding-top:36px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}

@media (max-width:560px){
  .stub{flex-direction:column;}
  .stub-tab{width:auto;border-left:none;border-top:1px dashed var(--border);}
  .choice-tiles{grid-template-columns:1fr;}
  .jumpgrid{grid-template-columns:repeat(8,1fr);}
  .result-grid{grid-template-columns:1fr;}
  .card{padding:22px;}
  #app{padding:18px 14px 40px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>

const QUESTION_BANK = {"Billing, Resources & Projects": [{"id": "bil-1", "module": "Billing, Resources & Projects", "q": "Which sequence correctly represents the Google Cloud resource hierarchy from highest to lowest?", "opts": {"A": "Project → Folder → Organization → Resource", "B": "Organization → Folder → Project → Resource", "C": "Organization → Project → Folder → Resource", "D": "Billing Account → Organization → Project → Folder"}, "correct": "B"}, {"id": "bil-2", "module": "Billing, Resources & Projects", "q": "What is the fundamental operating and administrative unit in Google Cloud?", "opts": {"A": "Zone", "B": "Project", "C": "Billing account", "D": "Folder"}, "correct": "B"}, {"id": "bil-3", "module": "Billing, Resources & Projects", "q": "A company has separate Development, Testing and Production environments, each containing several projects. What is the best way to organize them?", "opts": {"A": "Put all resources in one project.", "B": "Create folders for Development, Testing and Production.", "C": "Create a separate organization for every project.", "D": "Create one billing account for every VM."}, "correct": "B"}, {"id": "bil-4", "module": "Billing, Resources & Projects", "q": "A company applies the Viewer role to a group at the Production folder level. What happens?", "opts": {"A": "The role applies only to the folder itself.", "B": "Projects under that folder inherit the applicable Viewer permissions.", "C": "The users become Owners of all projects.", "D": "The role is copied separately into every project and removed from the folder."}, "correct": "B"}, {"id": "bil-5", "module": "Billing, Resources & Projects", "q": "Which statement about folders is correct?", "opts": {"A": "Every project must belong to a folder.", "B": "Folders can contain projects and other folders.", "C": "Folders contain only billing accounts.", "D": "A folder cannot have an IAM policy."}, "correct": "B"}, {"id": "bil-6", "module": "Billing, Resources & Projects", "q": "What is the primary purpose of a Cloud Billing account?", "opts": {"A": "To provide user authentication", "B": "To determine who pays for linked project usage", "C": "To store application source code", "D": "To organize projects into departments"}, "correct": "B"}, {"id": "bil-7", "module": "Billing, Resources & Projects", "q": "How many Cloud Billing accounts can a Google Cloud project be linked to at one time?", "opts": {"A": "One", "B": "Two", "C": "Five", "D": "Unlimited"}, "correct": "A"}, {"id": "bil-8", "module": "Billing, Resources & Projects", "q": "One Cloud Billing account can be linked to:", "opts": {"A": "Only one project", "B": "One or more projects", "C": "Only projects in one folder", "D": "Only projects with the same project name"}, "correct": "B"}, {"id": "bil-9", "module": "Billing, Resources & Projects", "q": "A finance analyst needs to view costs across every project linked to a billing account but must not modify billing settings. Which type of role is most appropriate?", "opts": {"A": "Billing Account Viewer", "B": "Project Owner", "C": "Compute Admin", "D": "Billing Account Administrator"}, "correct": "A"}, {"id": "bil-10", "module": "Billing, Resources & Projects", "q": "A project administrator can create VMs but cannot link the project to a billing account. Why?", "opts": {"A": "Compute permissions and billing permissions are separate.", "B": "Only Google Support can link billing accounts.", "C": "Projects cannot use billing accounts.", "D": "The administrator must delete the project first."}, "correct": "A"}, {"id": "bil-11", "module": "Billing, Resources & Projects", "q": "A company creates a monthly budget of $5,000 with an alert at 80%. What happens when costs reach $4,000?", "opts": {"A": "All project resources automatically stop.", "B": "An alert can be triggered, but normal usage continues.", "C": "The billing account is deleted.", "D": "The project becomes read-only."}, "correct": "B"}, {"id": "bil-12", "module": "Billing, Resources & Projects", "q": "Which statement about standard Cloud Billing budgets is true?", "opts": {"A": "They automatically prevent all spending beyond the budget amount.", "B": "They are primarily used for monitoring and notifications.", "C": "They automatically delete expensive resources.", "D": "They replace project quotas."}, "correct": "B"}, {"id": "bil-13", "module": "Billing, Resources & Projects", "q": "A company wants to trigger an automated workflow when a billing threshold is reached. What should it configure?", "opts": {"A": "A budget with Pub/Sub notifications", "B": "A VPC firewall rule", "C": "A project label only", "D": "A custom machine type"}, "correct": "A"}, {"id": "bil-14", "module": "Billing, Resources & Projects", "q": "Why should you be cautious about automatically disabling billing when a budget is exceeded?", "opts": {"A": "It increases VM performance.", "B": "It can shut down services and may cause resources to be irretrievably deleted.", "C": "It automatically increases quotas.", "D": "It grants users additional IAM roles."}, "correct": "B"}, {"id": "bil-15", "module": "Billing, Resources & Projects", "q": "Which project identifier can be changed after a project is created?", "opts": {"A": "Project ID", "B": "Project number", "C": "Project display name", "D": "All three identifiers"}, "correct": "C"}, {"id": "bil-16", "module": "Billing, Resources & Projects", "q": "Which project identifier must be globally unique?", "opts": {"A": "Project display name", "B": "Project ID", "C": "Folder name", "D": "Resource label"}, "correct": "B"}, {"id": "bil-17", "module": "Billing, Resources & Projects", "q": "Which project identifier is automatically assigned by Google and is numeric?", "opts": {"A": "Project name", "B": "Project ID", "C": "Project number", "D": "Folder name"}, "correct": "C"}, {"id": "bil-18", "module": "Billing, Resources & Projects", "q": "Which command creates a new Google Cloud project?", "opts": {"A": "gcloud compute projects create PROJECT_ID", "B": "gcloud projects create PROJECT_ID", "C": "gcloud billing projects create PROJECT_ID", "D": "gcloud resource create-project PROJECT_ID"}, "correct": "B"}, {"id": "bil-19", "module": "Billing, Resources & Projects", "q": "An application receives an error indicating that a required Google Cloud API is disabled. What should the administrator do?", "opts": {"A": "Recreate the organization.", "B": "Enable the required API in the project.", "C": "Change the project display name.", "D": "Delete the billing account."}, "correct": "B"}, {"id": "bil-20", "module": "Billing, Resources & Projects", "q": "Which command enables the Compute Engine API?", "opts": {"A": "gcloud compute enable", "B": "gcloud services enable compute.googleapis.com", "C": "gcloud projects enable compute", "D": "gcloud api start compute"}, "correct": "B"}, {"id": "bil-21", "module": "Billing, Resources & Projects", "q": "What is the main purpose of Google Cloud quotas?", "opts": {"A": "To replace IAM roles", "B": "To restrict resource consumption and API usage", "C": "To rename projects automatically", "D": "To calculate employee salaries"}, "correct": "B"}, {"id": "bil-22", "module": "Billing, Resources & Projects", "q": "An application is expected to grow significantly next month and may exceed its Compute Engine CPU quota. What should the administrator do?", "opts": {"A": "Wait until the quota is exceeded.", "B": "Request a quota increase in advance.", "C": "Create a budget instead.", "D": "Rename the project."}, "correct": "B"}, {"id": "bil-23", "module": "Billing, Resources & Projects", "q": "Which statement correctly distinguishes a quota from a budget?", "opts": {"A": "A budget restricts API requests, while a quota sends cost alerts.", "B": "A quota controls resource or API usage; a budget tracks spending.", "C": "Both always stop spending immediately.", "D": "There is no difference."}, "correct": "B"}, {"id": "bil-24", "module": "Billing, Resources & Projects", "q": "A company wants to identify costs belonging to different departments within the same project. Which feature is most useful?", "opts": {"A": "Labels", "B": "Zones", "C": "Firewall rules", "D": "Snapshots"}, "correct": "A"}, {"id": "bil-25", "module": "Billing, Resources & Projects", "q": "A company wants centralized governance while allowing each department to maintain separate projects. Which architecture is best?", "opts": {"A": "One unrelated project for every individual user", "B": "Organization → Department folders → Projects", "C": "One billing account acting as the resource hierarchy root", "D": "Separate public resources without projects"}, "correct": "B"}], "Compute Engine & VMs": [{"id": "com-1", "module": "Compute Engine & VMs", "q": "What is Google Compute Engine?", "opts": {"A": "A managed relational database service", "B": "An Infrastructure as a Service offering for running virtual machines", "C": "An object-storage service", "D": "A serverless function platform"}, "correct": "B"}, {"id": "com-2", "module": "Compute Engine & VMs", "q": "Which Compute Engine resource determines the number of virtual CPUs and amount of memory available to a VM?", "opts": {"A": "Machine type", "B": "Disk snapshot", "C": "Firewall rule", "D": "Instance label"}, "correct": "A"}, {"id": "com-3", "module": "Compute Engine & VMs", "q": "A small web application has unpredictable but generally low CPU usage. The company wants an economical general-purpose VM. Which machine family is commonly suitable?", "opts": {"A": "E2", "B": "Memory-optimized", "C": "Accelerator-optimized", "D": "Sole-tenant only"}, "correct": "A"}, {"id": "com-4", "module": "Compute Engine & VMs", "q": "A database requires 700 GB of memory and relatively fewer CPUs compared with its memory requirement. Which machine category should you consider?", "opts": {"A": "Shared-core machine type", "B": "Memory-optimized machine type", "C": "Compute-optimized machine type", "D": "Spot E2 micro VM"}, "correct": "B"}, {"id": "com-5", "module": "Compute Engine & VMs", "q": "A scientific application performs CPU-intensive calculations and requires high per-core performance. Which type of machine family is most suitable?", "opts": {"A": "Compute-optimized", "B": "Memory-optimized", "C": "Shared-core", "D": "Storage-only"}, "correct": "A"}, {"id": "com-6", "module": "Compute Engine & VMs", "q": "A team needs a VM with a nonstandard combination of vCPUs and memory. What should the team use?", "opts": {"A": "A custom machine type", "B": "A Cloud Storage lifecycle rule", "C": "A fixed snapshot", "D": "A firewall target tag"}, "correct": "A"}, {"id": "com-7", "module": "Compute Engine & VMs", "q": "An administrator wants to change the machine type of an existing VM. What is normally required first?", "opts": {"A": "Delete its project.", "B": "Stop the VM.", "C": "Delete its boot disk.", "D": "Convert the VM to a managed instance group."}, "correct": "B"}, {"id": "com-8", "module": "Compute Engine & VMs", "q": "Which command creates a basic Compute Engine VM?", "opts": {"A": "gcloud compute instances create web-vm --zone=us-central1-a", "B": "gcloud vm create web-vm", "C": "gcloud projects create-instance web-vm", "D": "gcloud storage instances create web-vm"}, "correct": "A"}, {"id": "com-9", "module": "Compute Engine & VMs", "q": "Which command lists VM instances in a project?", "opts": {"A": "gcloud compute instances list", "B": "gcloud compute disks list-vms", "C": "gcloud services list-instances", "D": "gcloud projects instances show"}, "correct": "A"}, {"id": "com-10", "module": "Compute Engine & VMs", "q": "Which command connects to a Linux Compute Engine VM using SSH?", "opts": {"A": "gcloud compute ssh VM_NAME --zone=ZONE", "B": "gcloud compute connect VM_NAME", "C": "gcloud ssh projects/VM_NAME", "D": "gcloud network ssh VM_NAME"}, "correct": "A"}, {"id": "com-11", "module": "Compute Engine & VMs", "q": "What is the boot disk of a Compute Engine VM primarily used for?", "opts": {"A": "Storing the isk. What should it configure?", "opts": {"A": "A snapshot schedule", "B": "A firewall schedule", "C": "An instance label", "D": "A startup script that deletes the disk"}, "correct": "A"}, {"id": "com-18", "module": "Compute Engine & VMs", "q": "Which statement about Compute Engine snapshots is correct?", "opts": {"A": "Every snapshot is always a completely separate full copy.", "B": "Standard snapshots are incremental.", "C": "Snapshots can back up Local SSD data.", "D": "A snapshot is the same as a firewall rule."}, "correct": "B"}, {"id": "com-19", "module": "Compute Engine & VMs", "q": "What is the main purpose of a custom image?", "opts": {"A": "To create new VM boot disks with a reusable operating-system configuration", "B": "To distribute incoming network traffic", "C": "To provide temporary external IP addresses", "D": "To manage IAM groups"}, "correct": "A"}, {"id": "com-20", "module": "Compute Engine & VMs", "q": "A company wants to back up a VM’s disks and much of its instance configuration as one resource. Which option is most appropriate?", "opts": {"A": "Machine image", "B": "Firewall rule", "C": "Sole-tenant node", "D": "Static route"}, "correct": "A"}, {"id": "com-21", "module": "Compute Engine & VMs", "q": "What is an instance template?", "opts": {"A": "A reusable specification for creating VM instances", "B": "A backup of a Cloud Storage object", "C": "An IAM custom role", "D": "A network packet capture"}, "correct": "A"}, {"id": "com-22", "module": "Compute Engine & VMs", "q": "Can you directly edit an existing instance template?", "opts": {"A": "Yes, every field can be edited.", "B": "No; create a new template when configuration changes are required.", "C": "Only the machine type can be edited.", "D": "Only the template name can be edited."}, "correct": "B"}, {"id": "com-23", "module": "Compute Engine & VMs", "q": "What is the primary advantage of a managed instance group?", "opts": {"A": "It manages a collection of similar VMs and supports features such as autoscaling and autohealing.", "B": "It stores objects in buckets.", "C": "It provides a relational database.", "D": "It replaces Cloud IAM."}, "correct": "A"}, {"id": "com-24", "module": "Compute Engine & VMs", "q": "What is the difference between a managed and unmanaged instance group?", "opts": {"A": "A managed group can create and maintain similar VMs automatically; an unmanaged group contains VMs administered individually.", "B": "An unmanaged group always supports autoscaling.", "C": "A managed group cannot use a load balancer.", "D": "There is no difference."}, "correct": "A"}, {"id": "com-25", "module": "Compute Engine & VMs", "q": "A web application experiences varying traffic throughout the day. The company wants the number of VM instances to increase and decrease automatically. Which feature should it use?", "opts": {"A": "MIG autoscaling", "B": "Object Lifecycle Management", "C": "Disk cloning", "D": "Cloud KMS rotation"}, "correct": "A"}, {"id": "com-26", "module": "Compute Engine & VMs", "q": "A company wants unhealthy VMs in a managed instance group to be automatically recreated. What should it configure?", "opts": {"A": "A health check and autohealing policy", "B": "A snapshot only", "C": "A static external IP", "D": "An object hold"}, "correct": "A"}, {"id": "com-27", "module": "Compute Engine & VMs", "q": "A service must remain available even if one zone fails. Which architecture is best?", "opts": {"A": "A regional managed instance group distributed across multiple zones", "B": "One VM in one zone", "C": "One Local SSD only", "D": "One unmanaged VM with an ephemeral IP"}, "correct": "A"}, {"id": "com-28", "module": "Compute Engine & VMs", "q": "A batch-processing workload can tolerate interruption and restart. The company wants lower compute cost. Which VM provisioning model is appropriate?", "opts": {"A": "Spot VM", "B": "Sole-tenant VM only", "C": "Standard VM with static IP", "D": "Confidential VM only"}, "correct": "A"}, {"id": "co ge data by default?", "opts": {"A": "Customer-managed encryption only", "B": "Google-managed encryption", "C": "Client-side encryption only", "D": "Password-based encryption"}, "correct": "B"}, {"id": "goo-17", "module": "Google Cloud Storage", "q": "Customer-managed encryption keys used by Cloud Storage are managed through:", "opts": {"A": "Compute Engine", "B": "Cloud Key Management Service", "C": "BigQuery", "D": "IAM Conditions"}, "correct": "B"}, {"id": "goo-18", "module": "Google Cloud Storage", "q": "What happens when Object Versioning is enabled and a live object is overwritten?", "opts": {"A": "The old object is always permanently deleted.", "B": "The previous generation becomes noncurrent.", "C": "The bucket is deleted.", "D": "The upload is rejected."}, "correct": "B"}, {"id": "goo-19", "module": "Google Cloud Storage", "q": "Which managed service can transfer large datasets into Cloud Storage?", "opts": {"A": "Cloud Run", "B": "Storage Transfer Service", "C": "Pub/Sub", "D": "Cloud SQL"}, "correct": "B"}, {"id": "goo-20", "module": "Google Cloud Storage", "q": "What is the primary purpose of Storage Transfer Service?", "opts": {"A": "Encrypt buckets", "B": "Transfer data between supported storage systems", "C": "Create IAM users", "D": "Create Google Cloud projects"}, "correct": "B"}, {"id": "goo-21", "module": "Google Cloud Storage", "q": "Which traditional storage class generally has the highest at-rest storage price?", "opts": {"A": "Standard", "B": "Nearline", "C": "Coldline", "D": "Archive"}, "correct": "A"}, {"id": "goo-22", "module": "Google Cloud Storage", "q": "Which traditional storage class generally has the lowest at-rest storage price?", "opts": {"A": "Standard", "B": "Nearline", "C": "Coldline", "D": "Archive"}, "correct": "D"}, {"id": "goo-23", "module": "Google Cloud Storage", "q": "Which feature prevents objects from being deleted or replaced until they satisfy a required retention period?", "opts": {"A": "Lifecycle rules", "B": "Retention policy", "C": "Labels", "D": "Signed URLs"}, "correct": "B"}, {"id": "goo-24", "module": "Google Cloud Storage", "q": "What is an object hold?", "opts": {"A": "A mechanism that prevents an object from being deleted or replaced while the hold is active", "B": "A mechanism that encrypts the object", "C": "A compression feature", "D": "A transfer operation"}, "correct": "A"}, {"id": "goo-25", "module": "Google Cloud Storage", "q": "Which access mechanism is generally preferred for centralized enterprise environments?", "opts": {"A": "Individual object ACLs", "B": "Bucket ACLs", "C": "IAM", "D": "Public access"}, "correct": "C"}, {"id": "goo-26", "module": "Google Cloud Storage", "q": "A sensitive bucket is accidentally made publicly accessible. Which security principle has been violated?", "opts": {"A": "High availability", "B": "Least privilege", "C": "Elasticity", "D": "Fault tolerance"}, "correct": "B"}, {"id": "goo-27", "module": "Google Cloud Storage", "q": "Cloud Storage is primarily an example of:", "opts": {"A": "Block storage", "B": "Network file storage", "C": "Object storage", "D": "Relational database storage"}, "correct": "C"}, {"id": "goo-28", "module": "Google Cloud Storage", "q": "Which feature can automatically move objects from Standard to Archive after one year?", "opts": {"A": "IAM", "B": "Lifecycle Management", "C": "Object Versioning", "D": "ACLs"}, "correct": "B"}, {"id": "goo-29", "module": "Google Cloud Storage", "q": "When Object Versioning is enabled, deleting a live object generally causes:", "opts": {"A": "Immediate permanent deletion of every generation", "B": "The deleted live generation to be preserved as a noncurrent version", "C": "The bucket to be deleted", "D": "The bucket IAM policy to be removed"}, "correct": "B"}, {"id": "goo-30", "module": "Google Cloud Storage", "q": "What is the maximum size of a single Cloud Storage object?", "opts": {"A": "5 TiB", "B": "10 TiB", "C": "Unlimited", "D": "100 GiB"}, "correct": "A"}, {"id": "goo-31", "module": "Google Cloud Storage", "q": "Which service manages customer-managed encryption keys for Cloud Storage?", "opts": {"A": "Secret Manager", "B": "Cloud KMS", "C": "IAM", "D": "Compute Engine"}, "correct": "B"}, {"id": "goo-32", "module": "Google Cloud Storage", "q": "Which feature combination is best when compliance requires an immutable bucket-wide retention period?", "opts": {"A": "Object Versioning only", "B": "Retention policy with Bucket Lock", "C": "Signed URL", "D": "Labels"}, "correct": "B"}, {"id": "goo-33", "module": "Google Cloud Storage", "q": "Which location type is commonly suitable for serving data across users distributed throughout a broad geographical area?", "opts": {"A": "Regional", "B": "Multi-region", "C": "Zonal persistent disk", "D": "Local SSD"}, "correct": "B"}, {"id": "goo-34", "module": "Google Cloud Storage", "q": "Which feature provides temporary access to a private object without granting the recipient an IAM role?", "opts": {"A": "ACL", "B": "Signed URL", "C": "Lifecycle rule", "D": "Bucket Lock"}, "correct": "B"}, {"id": "goo-35", "module": "Google Cloud Storage", "q": "Which combination most closely follows Cloud Storage security and management best practices?", "opts": {"A": "Public buckets and object ACLs everywhere", "B": "IAM, Uniform Bucket-Level Access, lifecycle policies, and CMEK when required", "C": "Shared passwords", "D": "Disabled encryption"}, "correct": "B"}], "IAM": [{"id": "iam-1", "module": "IAM", "q": "A developer needs to create, start, stop, and delete Compute Engine virtual machines but should not have permission to manage Cloud SQL databases. Which IAM role should you assign?", "opts": {"A": "Viewer", "B": "Editor", "C": "Compute Admin", "D": "Cloud SQL Admin"}, "correct": "C"}, {"id": "iam-2", "module": "IAM", "q": "A company wants every developer to have the same permissions. New developers join every month. What is the best approach?", "opts": {"A": "Assign roles individually", "B": "Make eve // and across every device. Leave this as "REPLACE_ME" and the app will walk

};

/* ===================== STORAGE HELPERS (KVdb.io) ===================== */
const KVDB_BASE = 'https://kvdb.io/' + KVDB_BUCKET_ID + '/';

async function storageGet(key) {
  try {
    const res = await fetch(KVDB_BASE + encodeURIComponent(key));
    if (res.status === 404) return null;
    if (!res.ok) { state.storageDown = true; return null; }
    state.storageDown = false;
    const text = await res.text();
    return text === '' ? null : text;
  } catch (e) {
    state.storageDown = true;
    return null;
  }
}
async function storageSet(key, value) {
  try {
    const res = await fetch(KVDB_BASE + encodeURIComponent(key), {
      method: 'POST',
      body: value
    });
    state.storageDown = !res.ok;
    return res.ok;
  } catch (e) {
    console.error('storage set failed', e);
    state.storageDown = true;
    return false;
  }
}
async function storageDelete(key) {
  try {
    await fetch(KVDB_BASE + encodeURIComponent(key), { method: 'DELETE' });
  } catch (e) { /* ignore */ }
}
async function storageList(prefix) {
  try {
    const res = await fetch(KVDB_BASE + '?prefix=' + encodeURIComponent(prefix) + '&format=json&limit=10000');
    if (!res.ok) { state.storageDown = true; return []; }
    state.storageDown = false;
    const arr = await res.json();
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    state.storageDown = true;
    return [];
  }
}

/* ===================== FIRST-RUN BUCKET SETUP ===================== */
async function createKvdbBucket(email) {
  const res = await fetch('https://kvdb.io', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'email=' + encodeURIComponent(email)
  });
  if (!res.ok) throw new Error('Could not create a bucket (HTTP ' + res.status + ').');
  const bucketId = (await res.text()).trim();
  // Note: keys in a free-tier bucket expire after 7 days of no updates.
  // That's fine for a single exam window. (Disabling expiry entirely is a
  // paid-plan feature on kvdb.io, so we deliberately don't attempt it here
  // — trying to do so caused the free bucket to reject writes.)
  return bucketId;
}

function studentKey(roll){ return 'student:' + roll; }
function examStateKey(roll){ return 'examstate:' + roll; }

async function getStudentRecord(roll){
  const raw = await storageGet(studentKey(roll));
  if (!raw) return { roll, attempts: [] };
  try { return JSON.parse(raw); } catch(e){ return { roll, attempts: [] }; }
}
async function saveStudentRecord(rec){
  await storageSet(studentKey(rec.roll), JSON.stringify(rec));
}
async function getExamState(roll){
  const raw = await storageGet(examStateKey(roll));
  if (!raw) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}
async function saveExamState(roll, exam){
  await storageSet(examStateKey(roll), JSON.stringify(exam));
}
async function clearExamState(roll){
  await storageDelete(examStateKey(roll));
}

/* ===================== UTIL ===================== */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalizeRoll(v){
  return (v || '').trim().toUpperCase().replace(/\s+/g,'');
}
function fmtTime(totalSec){
  const s = Math.max(0, Math.ceil(totalSec));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
function fmtDate(ts){
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' ' +
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== EXAM BUILD ===================== */
function shuffleOptions(q){
  const letters = ['A','B','C','D'];
  const entries = letters.map(l => ({ text: q.opts[l], wasCorrect: l === q.correct }));
  const shuffled = shuffle(entries);
  const newOpts = {};
  let newCorrect = 'A';
  shuffled.forEach((e, i) => {
    const letter = letters[i];
    newOpts[letter] = e.text;
    if (e.wasCorrect) newCorrect = letter;
  });
  return { ...q, opts: newOpts, correct: newCorrect };
}

function buildExamQuestions(){
  let pool = [];
  MODULE_ORDER.forEach(mod => {
    const picked = shuffle(QUESTION_BANK[mod]).slice(0, QUESTIONS_PER_MODULE);
    picked.forEach(q => pool.push(shuffleOptions(q)));
  });
  return shuffle(pool);
}

function selectAnswer(qId, letter){
  state.exam.answers[qId] = letter;
  saveExamState(state.roll, state.exam);
  render();
}

function confirmSubmit(){
  const exam = state.exam;
  const unanswered = TOTAL_QUESTIONS - Object.keys(exam.answers).length;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question${unanswered===1?'':'s'}. Submit anyway?`
    : `Submit your exam? You won't be able to change answers after this.`;
  if (window.confirm(msg)) {
    finalizeExam(exam, false);
  }
}

async function finalizeExam(exam, autoSubmitted){
  stopTimer();
  let score = 0;
  exam.questions.forEach(q => {
    if (exam.answers[q.id] === q.correct) score++;
  });
  const rec = await getStudentRecord(exam.roll);
  const attemptRecord = {
    attemptNo: exam.attemptNo,
    score,
    total: TOTAL_QUESTIONS,
    startedAt: exam.startedAt,
    submittedAt: Date.now(),
    autoSubmitted
  };
  rec.attempts.push(attemptRecord);
  rec.roll = exam.roll;
  await saveStudentRecord(rec);
  await clearExamState(exam.roll);

  state.studentRecord = rec;
  state.lastResult = attemptRecord;
  state.exam = null;
  state.screen = 'result';
  render();
}

    const row = [
      rec.roll,
      a1 ? a1.score : '', a1 ? a1.total : '', a1 ? a1.autoSubmitted : '', a1 ? new Date(a1.submittedAt).toISOString() : '',
      a2 ? a2.score : '', a2 ? a2.total : '', a2 ? a2.autoSubmitted : '', a2 ? new Date(a2.submittedAt).toISOString() : '',
      rec.attempts.length ? best : '',
      rec.attempts.length
    ];
    lines.push(row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ace_exam_results_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ===================== TIMER ===================== */
function startTimer(){
  stopTimer();
  timerHandle = setInterval(() => {
    if (!state.exam || state.screen !== 'exam') { stopTimer(); return; }
    const remaining = state.exam.durationSec - (Date.now() - state.exam.startedAt) / 1000;
    const el = document.getElementById('timer-display');
    if (el) {
      el.textContent = fmtTime(remaining);
      el.className = 'timer' + (remaining <= 60 ? ' danger' : remaining <= 300 ? ' warn' : '');
    }
    if (remaining <= 0) {
      stopTimer();
      finalizeExam(state.exam, true);
    }
  }, 1000);
}
function stopTimer(){
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
}

/* ===================== INIT ===================== */
if (KVDB_BUCKET_ID === 'REPLACE_ME') {
  state.screen = 'setup';
}
render();

</script>
